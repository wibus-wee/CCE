[workspace]
members = [
  "crates/cce-core",
  "crates/cce-store",
  "crates/cce-engine",
  "apps/cli",
  "apps/daemon",
  "apps/gateway",
  "apps/mcp",
  "apps/push",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/wibus-wee/CCE"
readme = "README.md"
authors = ["CCE Contributors"]
keywords = ["code-search", "code-intelligence", "retrieval", "mcp", "indexing"]
categories = ["development-tools"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
blake3 = "1.8"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6.0"
futures = "0.3"
fs4 = "1.1"
gix = { version = "0.86", default-features = false, features = ["revision", "sha1"] }
imara-diff = { package = "gix-imara-diff", version = "0.2.4", features = ["unified_diff"] }
ignore = "0.4"
parking_lot = "0.12"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream",
  "blocking",
  "json",
] }
fastembed = { version = "~6.0.3", default-features = false, features = [
  "hf-hub-rustls-tls",
  "ort-download-binaries-rustls-tls",
] }
rusqlite = { version = "0.37", features = ["bundled", "chrono", "uuid"] }
schemars = { version = "1.0", features = ["chrono04", "uuid1"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = { version = "1.15", features = ["serde"] }
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "io-std", "io-util", "net"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tree-sitter = "0.26"
tree-sitter-c-sharp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
uuid = { version = "1.17", features = ["v7", "serde"] }
walkdir = "2.5"
zerocopy = { version = "0.8", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
# Public API is a contract: every reachable item carries a doc string.
missing_docs = "warn"
# --- cheap correctness/style hygiene ---------------------------------------
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
keyword_idents = { level = "warn", priority = -1 }
non_ascii_idents = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[workspace.lints.rustdoc]
bare_urls = "warn"
broken_intra_doc_links = "warn"
invalid_codeblock_attributes = "warn"
invalid_rust_codeblocks = "warn"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
# Strict profile: `all` + `pedantic` + `nursery` + `cargo` at warn, with
# `clippy -D warnings` in CI promoting them to errors. `pedantic`/`nursery`
# are noisy by design; each allow below is a deliberate trade-off for this
# codebase, not a blanket exemption.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -2 }
nursery = { level = "warn", priority = -3 }
cargo = { level = "warn", priority = -4 }
# --- restriction subset: panic paths and unchecked indexing -----------------
# Panicking sugar is allowed in tests via clippy.toml; production code returns
# Result or uses explicit `unwrap_or`/`expect`-free control flow.
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# --- deliberate restriction non-adoptions -----------------------------------
# `as_conversions`/`arithmetic_side_effects` conflict with the deliberate cast
# allows below: score math is intentionally lossy and documented as such.
# `exit` is not adopted: CLI entry points may terminate the process.
# --- deliberate cargo allows ------------------------------------------------
# Duplicate dependency versions are owned by deny.toml [bans]
# (`multiple-versions = "warn"`); one owner per fact.
multiple_crate_versions = "allow"
# --- deliberate nursery allows ----------------------------------------------
# `redundant_pub_crate` conflicts with rustc's `unreachable_pub`: both lint the
# same visibility spelling in opposite directions. The crate convention is
# `unreachable_pub` — crate-internal items say `pub(crate)`, not `pub`.
redundant_pub_crate = "allow"
# --- deliberate pedantic allows -------------------------------------------
# `if cond {}` blocks are often clearer than `let ... else` / bool chains here.
collapsible_if = "allow"
# Public API is documented at the module/type level; per-method # Errors /
# # Panics sections would duplicate what CceError already communicates.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Crate naming (cce_*) legitimately repeats across module paths.
module_name_repetitions = "allow"
# #[must_use] is applied where misuse is plausible; flagging every pure getter
# is noise.
must_use_candidate = "allow"
# Score/rank math (usize→f64) and domain-bounded values (confidence f64→f32,
# line counts usize→u32) are intentionally lossy; explicit try_from is already
# used where overflow is a correctness concern (e.g. u64→i64 SQLite columns).
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Newline counting via iterator is clear and fast enough; no bytecount dep.
naive_bytecount = "allow"
# Indexing orchestration functions are deliberately kept as readable linear
# pipelines; splitting them mechanically would hurt more than help.
too_many_lines = "allow"
# Parser kind-mapping arms are grouped by language for readability even when
# bodies coincide.
match_same_arms = "allow"
# Error types and JSON values are idiomatically passed by value here.
needless_pass_by_value = "allow"
# `embedder`/`embedded`-style pairs are the natural names in context.
similar_names = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.bench]
debug = true
