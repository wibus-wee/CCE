name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-nextest@0.9.145
      - run: cargo nextest run --workspace --all-features --locked

  # Verifies the declared `rust-version` floor, not just the pinned toolchain.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.0 --profile minimal
      - run: cargo +1.97.0 check --workspace --all-features --locked

  # rustdoc lints (intra-doc links, code blocks) promoted to errors.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # Declared-but-unused dependencies drift; machete is the canonical check.
  unused-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete --with-metadata

  # Informational coverage: no threshold gate yet — the number is reported so
  # a gate can be chosen from observed values rather than guessed.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-nextest@0.9.145,cargo-llvm-cov@0.9.1
      - run: cargo llvm-cov nextest --workspace --all-features --locked --summary-only

  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo check --workspace --all-targets --all-features --locked

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:check
      - run: pnpm web:build

  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.8.8
      - run: uv sync --project research --locked --group dev
      - run: uv run --project research ruff check research
      - run: uv run --project research mypy research/cce_research
      - run: uv run --project research pytest
      - run: uv run --project research cce-research validate-dataset benchmarks/datasets/cce-self.jsonl

  # The release image + runtime smoke. On PRs it only runs when packaging
  # files changed (the rust job already gates code); on main it always runs.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changes
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}..HEAD" \
            | grep -qE '^(Dockerfile|\.dockerignore|docker-compose\.yml)$' \
            && echo "docker=true" >> "$GITHUB_OUTPUT" || true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: github.event_name != 'pull_request' || steps.changes.outputs.docker == 'true'
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: github.event_name != 'pull_request' || steps.changes.outputs.docker == 'true'
        with:
          context: .
          load: true
          tags: cce:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke — daemon answers /healthz
        if: github.event_name != 'pull_request' || steps.changes.outputs.docker == 'true'
        run: |
          # Sparse mode: no model download in CI.
          docker run -d --name cce -p 127.0.0.1:7734:7734 \
            -e CCE_DENSE=disabled -e CCE_DATA_DIR=/var/lib/cce \
            -v "$PWD:/repository:ro" cce:ci
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:7734/healthz && exit 0 || sleep 2
          done
          docker logs cce
          exit 1
