name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix binaries
        if: runner.os != 'Windows'
        run: tar -C target/${{ matrix.target }}/release -czf cce-${{ matrix.target }}.tar.gz cce cce-daemon cce-mcp
      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/cce.exe,target/${{ matrix.target }}/release/cce-daemon.exe,target/${{ matrix.target }}/release/cce-mcp.exe -DestinationPath cce-${{ matrix.target }}.zip
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: cce-${{ matrix.target }}.*
