name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix binaries
        if: runner.os != 'Windows'
        run: tar -C target/${{ matrix.target }}/release -czf cce-${{ matrix.target }}.tar.gz cce cce-daemon cce-mcp
      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/cce.exe,target/${{ matrix.target }}/release/cce-daemon.exe,target/${{ matrix.target }}/release/cce-mcp.exe -DestinationPath cce-${{ matrix.target }}.zip
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 # zizmor: ignore[superfluous-actions] multi-file draft upload via gh is more verbose
        with:
          draft: true
          generate_release_notes: true
          files: cce-${{ matrix.target }}.*

  # Zoekt toolchain assets for `cce providers --provision`. Upstream
  # ships no binaries; Go cross-compiles from one runner, so a single
  # linux job produces every target triple the runtime maps.
  zoekt:
    runs-on: ubuntu-latest
    env:
      ZOEKT_REF: 153817f643cde8b229ee388c1dddbcf07f4798af
    steps:
      - uses: actions/setup-go@4b36064e14cc4218676b4dc67d09398f8b6ed659 # v5
        with:
          go-version: stable
      - name: Cross-build zoekt tools
        run: |
          set -euo pipefail
          mkdir -p zoekt-bin
          for spec in \
            "x86_64-unknown-linux-gnu linux amd64" \
            "aarch64-unknown-linux-gnu linux arm64" \
            "x86_64-apple-darwin darwin amd64" \
            "aarch64-apple-darwin darwin arm64" \
            "x86_64-pc-windows-msvc windows amd64"; do
            read -r triple goos goarch <<< "$spec"
            suffix=""
            [ "$goos" = windows ] && suffix=".exe"
            for tool in zoekt zoekt-index; do
              GOBIN="$PWD/zoekt-bin" GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
                go install "github.com/sourcegraph/zoekt/cmd/${tool}@${ZOEKT_REF}"
              mv "zoekt-bin/${tool}${suffix}" "zoekt-bin/${tool}-${triple}${suffix}"
            done
          done
          cd zoekt-bin && sha256sum zoekt-* > zoekt-SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: zoekt-bin/*
