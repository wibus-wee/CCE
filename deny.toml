[advisories]
version = 2
yanked = "deny"
ignore = [
  # Transitive chain: fastembed -> tokenizers -> paste. The advisory marks
  # paste as unmaintained and explicitly has no safe upgrade; this is not a
  # vulnerability. Keep the exception exact so all other advisories fail CI.
  "RUSTSEC-2024-0436",
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
