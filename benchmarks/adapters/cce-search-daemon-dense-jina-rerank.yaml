name: cce-search-daemon-dense-jina-rerank
# Retrieval stage only: jina-v2-base-code dense embeddings plus a local
# bge-reranker-v2-m3 cross-encoder pass over the fused head, all inside a
# warm cce-daemon session.
session: daemon
command:
  - target/release/cce
  - --json
  - search
  - "{repository}"
  - "{query}"
  - "{intent_args}"
  - "{route_args}"
  - --limit
  - "50"
timeout_seconds: 240
model_revision: none
dense: local
embedding_model: jinaai/jina-embeddings-v2-base-code
reranker: rozgo/bge-reranker-v2-m3
environment:
  CCE_DATA_DIR: .cce-benchmark
