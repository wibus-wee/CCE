name: cce-search-daemon-dense-jina-code-flow-replace
# Consolidation test: CCE_FLOW=replace runs the unified graph-flow pass
# INSTEAD of the legacy priors it subsumes (corroboration join, cluster
# support, file vote, symbol-evidence join).
session: daemon
command:
  - target/release/cce
  - --json
  - search
  - "{repository}"
  - "{query}"
  - "{intent_args}"
  - "{route_args}"
  - --limit
  - "50"
timeout_seconds: 360
model_revision: none
dense: local
embedding_model: jinaai/jina-embeddings-v2-base-code
environment:
  CCE_DATA_DIR: .cce-benchmark
  CCE_FLOW: "replace"
