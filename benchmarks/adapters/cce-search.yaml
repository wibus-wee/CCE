name: cce-search
# Retrieval stage only: raw SearchResult hits instead of the packed context.
# Use this adapter to score retrieval without the packing stage masking it.
command:
  - target/release/cce
  - --json
  - search
  - "{repository}"
  - "{query}"
  - "{intent_args}"
  - "{route_args}"
  - --limit
  - "50"
timeout_seconds: 120
model_identity: none
model_revision: none
environment:
  CCE_DATA_DIR: .cce-benchmark
