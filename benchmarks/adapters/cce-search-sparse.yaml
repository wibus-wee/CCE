name: cce-search-sparse
# Sparse control arm: pins `--dense disabled` so lexical/structural-only
# retrieval stays measurable after dense became the product default.
command:
  - target/release/cce
  - --json
  - search
  - "{repository}"
  - "{query}"
  - "{intent_args}"
  - "{route_args}"
  - --limit
  - "50"
timeout_seconds: 360
model_identity: none
model_revision: none
dense: disabled
environment:
  CCE_DATA_DIR: .cce-benchmark
